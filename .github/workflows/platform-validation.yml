name: Platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-and-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend and frontend
        run: |
          python -m pip install uv==0.10.7
          uv venv --python 3.12 cosmetic-agent/.venv
          uv pip install --python cosmetic-agent/.venv/bin/python --require-hashes -r cosmetic-agent/requirements-full.lock
          npm ci --prefix frontend
          chmod +x ops/runtime/*.sh
      - name: Offline tests and production frontend build
        run: ops/runtime/validate-platform.sh
      - name: Frozen image data and training integrity checks (CPU)
        run: |
          python -m venv .runtime/venvs/skin-data-checks
          .runtime/venvs/skin-data-checks/bin/python -m pip install --only-binary=:all: --require-hashes -r experiments/skin-vlm/requirements-data-tests.lock
          cd experiments/skin-vlm
          ../../.runtime/venvs/skin-data-checks/bin/python -m unittest test_contracts test_data_review test_photo_service research.test_app_comparison research.test_data_download research.v3.test_training_integrity research.v3.test_v3_research research.v3.test_finalization research.test_clean_expansion research.test_phone_external
      - name: Model process, BGE API and rebuild integrity checks (CPU)
        run: cosmetic-agent/.venv/bin/python -m unittest discover -s ops/runtime -p 'test_*.py'
      - name: Private Redis and mock-agent worker benchmark
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          cosmetic-agent/.venv/bin/python cosmetic-agent/tests/load/run_capacity.py --rounds 3
