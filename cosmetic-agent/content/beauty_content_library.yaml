dryness:
  - title: "洗完臉後先別滑手機"
    content: "很多人洗完臉後會先放空一下，但其實清潔後的一段時間內，肌膚表面的水分流失速度通常比較快。這也是為什麼有些人習慣在洗臉後盡快接續保養。"

  - title: "熱水其實不會把毛孔打開"
    content: "毛孔不像門一樣可以打開或關起來。比起『打開毛孔』，過熱的水更可能讓肌膚出現乾燥或泛紅感。"

  - title: "保養不是疊越多層越厲害"
    content: "角質層能承受的產品量其實有限。一次擦太多層，有時反而容易出現悶感、黏膩感或起屑。"

  - title: "片狀面膜不是天天敷就比較好"
    content: "有些人天天敷面膜後，反而更容易感到乾或敏感。使用頻率通常還是需要依照產品類型與個人膚感調整。"

  - title: "脖子其實很容易被忽略"
    content: "很多人保養只擦臉，但頸部也會接觸日曬、冷氣與摩擦。有人甚至會覺得脖子的乾燥感比臉更明顯。"

  - title: "保養品起屑不一定代表產品不好"
    content: "有時只是前一道產品還沒吸收、膠類成分互相堆疊，或一次擦太多層。"

  - title: "原來洗手也是保養流程的一部分"
    content: "手會碰到很多東西。洗臉前先洗手，能減少把灰塵、油脂與殘留物一起帶到臉上的機會。"

  - title: "睡不好時，肌膚感受也可能跟著變"
    content: "有些人熬夜後會更容易感到乾燥、暗沉或粗糙，因此作息也常被一起納入膚況觀察。"

oiliness:
  - title: "出油感不一定只是膚質問題"
    content: "天氣、壓力、睡眠、產品質地與活動量，都可能影響一天中的油光感受。"

  - title: "清爽型產品不代表完全沒保濕"
    content: "有些產品雖然主打清爽，但仍然能帶來保濕使用感。差別通常在質地與膚感。"

  - title: "一直吸油不一定能解決出油感"
    content: "有些人過度清潔或頻繁吸油後，反而更容易覺得乾或不舒服。"

  - title: "沒化妝也不一定要天天重度卸妝"
    content: "卸妝產品的使用頻率通常還是會依照防曬、彩妝與個人習慣調整。"

  - title: "枕頭套其實比想像中重要"
    content: "枕頭套每天都會接觸臉部、頭髮與保養品殘留，很多人會固定定期更換。"

  - title: "中午特別容易出油？很多人也是"
    content: "有些人會發現下午或長時間待冷氣房後，油光感更明顯，因此會特別記錄時間點。"

tightness:
  - title: "緊繃感其實很值得記錄"
    content: "有些人的緊繃感會出現在洗臉後，有些則是在冷氣房或換季時特別明顯。"

  - title: "手掌溫度也會影響使用感"
    content: "很多人會直接用手上保養品，而不是化妝棉，因為覺得摩擦感比較少。"

  - title: "天天去角質不一定會比較亮"
    content: "有些人去角質太頻繁後，反而會出現乾燥、緊繃或粗糙感。"

  - title: "冷氣房其實很容易讓人覺得乾"
    content: "長時間待在低濕度環境，有些人會特別容易出現緊繃或乾燥感。"

  - title: "有時候不是產品刺激，是擦太多"
    content: "一次混用太多高濃度保養品，有些人反而更容易覺得不舒服。"

redness_feeling:
  - title: "泛紅感通常會先從『感覺』開始"
    content: "很多人的第一反應不是看到紅，而是先感覺到熱、刺、癢或不舒服。"

  - title: "換季時的肌膚感受可能特別不穩定"
    content: "氣溫、濕度與作息改變，都可能讓平常穩定的人突然開始覺得泛紅或乾燥。"

  - title: "新產品先小範圍測試，是很多人的習慣"
    content: "有些人會先在耳後或局部區域試用幾天，再決定是否正式使用。"

  - title: "A醇、酸類產品很多人都會慢慢建立頻率"
    content: "有些人一開始不會天天使用，而是會依照自己的膚感逐漸調整。"

  - title: "泛紅感不一定只和產品有關"
    content: "壓力、天氣、熬夜、摩擦或清潔方式，也可能影響當天的膚感。"

roughness:
  - title: "粗糙感有時候和天氣變化很有關"
    content: "換季或濕度變化時，有些人會特別容易感到臉部不平滑。"

  - title: "不是所有顆粒感都需要狂去角質"
    content: "很多人一摸到粗糙就立刻加強清潔，但有時候肌膚只是暫時處於比較乾燥的狀態。"

  - title: "有些底妝其實會放大粗糙感"
    content: "霧面、高遮瑕或乾粉類產品，在某些膚況下可能會讓紋理感更明顯。"

  - title: "睡眠不足時，膚感也可能變粗"
    content: "有些人熬夜後不一定長痘，但會明顯感覺膚觸變差。"

sticky_feeling:
  - title: "黏膩感很多時候和疊擦順序有關"
    content: "不同產品混合後的使用感可能會改變，因此有些人會特別在意保養順序。"

  - title: "不是所有滋潤型產品都適合夏天"
    content: "同一款產品，在不同季節可能會帶來完全不同的膚感。"

  - title: "有些人會把『吸收速度』當成挑產品重點"
    content: "比起功效描述，很多人其實更在意擦完之後會不會悶、黏或厚重。"

  - title: "美妝蛋太濕，底妝可能更容易不服貼"
    content: "如果美妝蛋含水量太高，可能會影響粉底原本的遮瑕與持妝感。"

stable:
  - title: "穩定狀態其實很值得記錄"
    content: "不是只有不舒服才需要紀錄。很多人反而是透過穩定時期，找到適合自己的生活與保養節奏。"

  - title: "陰天其實也有人維持防曬習慣"
    content: "即使沒看到太陽，有些人仍然會維持日常防曬流程。"

  - title: "防曬很多時候不是出門前才想到"
    content: "不少產品會建議提早塗抹，因此很多人會把防曬納入固定出門流程。"

  - title: "原來手背試色不一定準"
    content: "很多人的手背顏色和臉不同，因此選粉底時會改看下顎線附近。"

  - title: "化妝光線真的會影響妝感判斷"
    content: "在黃光、頂光或單側光下化妝，有時會導致底妝過厚或修容失衡。"

makeup:
  - title: "遮瑕不一定是往瑕疵正中央點"
    content: "有些彩妝技巧會更重視邊界暈染，而不是單純一直疊厚度。"

  - title: "睫毛膏一直抽插其實很傷膏體"
    content: "反覆抽插容易讓更多空氣進入管內，很多人會改用旋轉方式取出刷頭。"

  - title: "畫眉前先控油，很多人覺得比較好畫"
    content: "如果眉毛附近殘留太多保養品，眉筆與眉粉有時會比較難附著。"

  - title: "亮片眼影很多人直接用手上"
    content: "比起刷具，手指有時更容易讓亮片服貼在眼皮上。"

  - title: "底妝斑駁時，有些人會先補保濕"
    content: "直接補粉不一定最自然，有些人會先整理乾燥區域再重新補妝。"

random:
  - title: "護唇膏其實也有塗法派系"
    content: "有人習慣橫著擦，有人則會順著唇紋方向塗抹。"

  - title: "原來刷具比想像中更容易藏東西"
    content: "刷具長時間沒清潔時，會慢慢累積彩妝、油脂與灰塵。"

  - title: "很多人的第一瓶保養品其實都是化妝水"
    content: "但後來才發現，比起步驟數量，自己喜歡的使用感好像更重要。"

  - title: "有些人會固定記錄『今天膚感很好』"
    content: "因為穩定的時候，反而更容易找到真正適合自己的保養節奏。"

  - title: "你有發現嗎？膚況其實很看心情"
    content: "壓力、睡眠、天氣與生活節奏，都可能讓每天的膚感不太一樣。"