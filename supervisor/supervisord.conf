[unix_http_server]
file=/tmp/blink-supervisor.sock
chmod=0700

[supervisord]
logfile=/var/lib/jenkins/tomod/supervisor/logs/supervisord.log
pidfile=/tmp/blink-supervisord.pid
childlogdir=/var/lib/jenkins/tomod/supervisor/logs
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/blink-supervisor.sock

[program:blink-frontend]
directory=/var/lib/jenkins/tomod/frontend
command=/usr/bin/npm run start -- --hostname 127.0.0.1 --port 3000
environment=NODE_ENV="production"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/jenkins/tomod/supervisor/logs/frontend.log
stderr_logfile=/var/lib/jenkins/tomod/supervisor/logs/frontend-error.log

[program:blink-backend]
directory=/var/lib/jenkins/tomod/cosmetic-agent
command=/opt/conda/envs/rocm_env/bin/python -m uvicorn api.api_server:app --host 127.0.0.1 --port 8005
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/lib/jenkins/tomod/supervisor/logs/backend.log
stderr_logfile=/var/lib/jenkins/tomod/supervisor/logs/backend-error.log

