# Shared deployment settings for the split Mac / MI300X topology.
# This file contains no credentials. Override values through the environment.

RUNTIME_DIR="${RUNTIME_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
PROJECT_ROOT="${PROJECT_ROOT:-$(cd "$RUNTIME_DIR/../.." && pwd)}"
ROOT="${ROOT:-$PROJECT_ROOT}" # compatibility for older helper scripts

# MI300X persistent volume. The mount verifier requires this exact path to be
# an active mount before it creates any child directory.
GOODAGENTS_ROOT="${GOODAGENTS_ROOT:-/mnt/goodagents}"
GOODAGENTS_EXPECTED_SOURCE="${GOODAGENTS_EXPECTED_SOURCE:-192.168.57.211:/AMD_vol/pvc-fa442967-d832-4eaa-a341-8d46317d8c11}"
PERSIST_ROOT="$GOODAGENTS_ROOT"
MODEL_DIR="${MODEL_DIR:-$GOODAGENTS_ROOT/models}"
HF_HOME="${HF_HOME:-$GOODAGENTS_ROOT/hf-cache}"
CHECKPOINT_DIR="${CHECKPOINT_DIR:-$GOODAGENTS_ROOT/checkpoints}"
OUTPUT_DIR="${OUTPUT_DIR:-$GOODAGENTS_ROOT/outputs}"
CHECKPOINT_BACKUP_DIR="${CHECKPOINT_BACKUP_DIR:-$GOODAGENTS_ROOT/checkpoint-backups}"

# Exact upstream revisions selected for this deployment. Artifact presence and
# file hashes are checked separately; a revision here is not evidence that the
# corresponding files already exist on the school volume.
PROD_MODEL_REPO="${PROD_MODEL_REPO:-taide/Gemma-3-TAIDE-12b-Chat}"
PROD_MODEL_REVISION="${PROD_MODEL_REVISION:-abae28ce090549c694cd130d8fe64a54a8f13a6e}"
AB_MODEL_REPO="${AB_MODEL_REPO:-taide/Gemma-3-TAIDE-12b-Chat-2602}"
AB_MODEL_REVISION="${AB_MODEL_REVISION:-4de0b93b99f8b61b59c40d019fd593bdd1c42249}"
EMBEDDING_MODEL_REPO="${EMBEDDING_MODEL_REPO:-BAAI/bge-m3}"
EMBEDDING_MODEL_REVISION="${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}"
RERANKER_MODEL_REPO="${RERANKER_MODEL_REPO:-BAAI/bge-reranker-v2-m3}"
RERANKER_MODEL_REVISION="${RERANKER_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}"
PHOTO_MODEL_REPO="${PHOTO_MODEL_REPO:-Qwen/Qwen3-VL-4B-Instruct}"
PHOTO_MODEL_REVISION="${PHOTO_MODEL_REVISION:-ebb281ec70b05090aa6165b016eac8ec08e71b17}"

PROD_MODEL_PATH="${PROD_MODEL_PATH:-$MODEL_DIR/taide-12b}"
AB_MODEL_PATH="${AB_MODEL_PATH:-$MODEL_DIR/taide-12b-2602}"
EMBEDDING_MODEL_PATH="${EMBEDDING_MODEL_PATH:-$MODEL_DIR/bge-m3}"
RERANKER_MODEL_PATH="${RERANKER_MODEL_PATH:-$MODEL_DIR/bge-reranker-v2-m3}"
PHOTO_MODEL_PATH="${PHOTO_MODEL_PATH:-$MODEL_DIR/qwen3-vl-4b-instruct}"
PHOTO_ADAPTER_PATH="${PHOTO_ADAPTER_PATH:-}"

# MI300X runtime environments. These are intentionally independent from the
# Mac backend environment.
CONDA="${CONDA:-/opt/conda/bin/conda}"
# Control-plane Python needs Linux pidfd APIs; model env Pythons may omit them.
MI300X_CONTROL_PYTHON="${MI300X_CONTROL_PYTHON:-/usr/bin/python3}"
# Historical vLLM stays isolated and disabled by default. The secure BGE
# environment must be installed independently; never upgrade the shared env.
VLLM_ENV="${VLLM_ENV:-$GOODAGENTS_ROOT/blink-runtime/envs/vllm-rocm-v092}"
EMBED_ENV="${EMBED_ENV:-$GOODAGENTS_ROOT/blink-runtime/envs/bge-secure-t213-r71}"
EMBEDDING_SERVICE_SOURCE="${EMBEDDING_SERVICE_SOURCE:-$GOODAGENTS_ROOT/blink-runtime/src/bge-secure-serving-20261116-v3}"
MI300X_BGE_CONTROLLER="${MI300X_BGE_CONTROLLER:-$GOODAGENTS_ROOT/blink-runtime/src/bge-secure-serving-20261116-v2/manage-bge-model.py}"
MI300X_PHOTO_CONTROLLER="${MI300X_PHOTO_CONTROLLER:-$GOODAGENTS_ROOT/blink-runtime/src/qwen-photo-control-20261116-v4/manage-photo-model.py}"
# Empty photo overrides preserve the manager's persistent secure active config.
PHOTO_ENV="${PHOTO_ENV:-}"
PHOTO_SERVICE_SOURCE="${PHOTO_SERVICE_SOURCE:-}"
ENGINE="${ENGINE:-vllm}"

VLLM_PROD_PORT="${VLLM_PROD_PORT:-8200}"
VLLM_AB_PORT="${VLLM_AB_PORT:-8201}"
VLLM_PROD_MEM="${VLLM_PROD_MEM:-0.35}"
VLLM_AB_MEM="${VLLM_AB_MEM:-0.30}"
VLLM_MAX_MODEL_LEN="${VLLM_MAX_MODEL_LEN:-32768}"
VLLM_MAX_NUM_SEQS="${VLLM_MAX_NUM_SEQS:-32}"
VLLM_PROFILE="${VLLM_PROFILE:-compat}"
ENABLE_TAIDE="${ENABLE_TAIDE:-0}"
ENABLE_AB_MODEL="${ENABLE_AB_MODEL:-0}"
ENABLE_RERANKER="${ENABLE_RERANKER:-0}"
ENABLE_PHOTO_MODEL="${ENABLE_PHOTO_MODEL:-0}"

LOGDIR="${LOGDIR:-$OUTPUT_DIR/runtime/logs}"
PIDDIR="${PIDDIR:-$OUTPUT_DIR/runtime/pids}"

die() { echo "[ERROR] $*" >&2; exit 2; }
log() { printf '\n[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }

verify_mi300x_control_python() {
  [[ -x "$MI300X_CONTROL_PYTHON" ]] || die "找不到 MI300X_CONTROL_PYTHON：$MI300X_CONTROL_PYTHON"
  env -u PYTHONPATH -u PYTHONHOME -u LD_PRELOAD -u LD_LIBRARY_PATH \
    PYTHONNOUSERSITE=1 "$MI300X_CONTROL_PYTHON" -I -c '
import os, signal
if not hasattr(os, "pidfd_open") or not hasattr(signal, "pidfd_send_signal"):
    raise SystemExit("Control Python requires pidfd_open and pidfd_send_signal")
descriptor = os.pidfd_open(os.getpid(), 0)
try:
    signal.pidfd_send_signal(descriptor, 0, None, 0)
finally:
    os.close(descriptor)
' || die "MI300X_CONTROL_PYTHON 缺少可用 pidfd 能力；停止控制，不回退裸 PID signal"
}
