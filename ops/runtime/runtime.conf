# Shared settings for ops/runtime scripts (added 2026-10-21). Override via environment.

ROOT="${ROOT:-/var/lib/jenkins/tomod}"
# Must be a host-mounted volume: the last container rebuild wiped everything not mounted.
PERSIST_ROOT="${PERSIST_ROOT:-/data/blink}"
CONDA="${CONDA:-/opt/conda/bin/conda}"

BACKEND_ENV="${BACKEND_ENV:-/opt/conda/envs/blink-backend}"
EMBED_ENV="${EMBED_ENV:-/opt/conda/envs/py_3.10}"          # existing ROCm torch 2.6 env from the image
# Already-built env from install_llm.sh: vLLM v0.8.5 + SGLang v0.4.6.post5 on torch 2.6 / ROCm 6.4.
VLLM_ENV="${VLLM_ENV:-/opt/venv-llm}"
# Serving engine for the model ports: vllm (default) or sglang. The :8000 gateway works with both.
ENGINE="${ENGINE:-vllm}"

MODEL_DIR="${MODEL_DIR:-$PERSIST_ROOT/models}"
PROD_MODEL_REPO="${PROD_MODEL_REPO:-taide/Gemma-3-TAIDE-12b-Chat}"
AB_MODEL_REPO="${AB_MODEL_REPO:-taide/Gemma-3-TAIDE-12b-Chat-2602}"
PROD_MODEL_PATH="${PROD_MODEL_PATH:-$MODEL_DIR/taide-12b}"
AB_MODEL_PATH="${AB_MODEL_PATH:-$MODEL_DIR/taide-12b-2602}"
HF_HOME="${HF_HOME:-$MODEL_DIR/hf-cache}"                  # BGE-M3 / reranker cache

PGDATA="${PGDATA:-$PERSIST_ROOT/postgres}"
PG_PORT="${PG_PORT:-5432}"
PG_DB="${PG_DB:-blinkai}"
PG_USER="${PG_USER:-blinkai}"
REDIS_DIR="${REDIS_DIR:-$PERSIST_ROOT/redis}"
REDIS_PORT="${REDIS_PORT:-6389}"

# vLLM: production model on 8200, optional A/B model on 8201, gateway on 8000 (+8003).
VLLM_PROD_PORT="${VLLM_PROD_PORT:-8200}"
VLLM_AB_PORT="${VLLM_AB_PORT:-8201}"
VLLM_PROD_MEM="${VLLM_PROD_MEM:-0.35}"
VLLM_AB_MEM="${VLLM_AB_MEM:-0.30}"
VLLM_MAX_MODEL_LEN="${VLLM_MAX_MODEL_LEN:-32768}"
VLLM_MAX_NUM_SEQS="${VLLM_MAX_NUM_SEQS:-32}"
VLLM_PROFILE="${VLLM_PROFILE:-compat}"                     # compat = --enforce-eager (proven); perf = HIP graphs
ENABLE_AB_MODEL="${ENABLE_AB_MODEL:-0}"

LOGDIR="$ROOT/ops/runtime/logs"
PIDDIR="$ROOT/ops/runtime/pids"

listener() { ss -H -ltn "sport = :$1" 2>/dev/null | grep -q .; }
die() { echo "[ERROR] $*" >&2; exit 2; }
log() { echo -e "\n\033[1;36m[$(date +%H:%M:%S)] $*\033[0m"; }
